<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PowerTrack</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #2563eb;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-main: #334155;
        }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--bg-light); color: var(--text-main); }
        header { background: var(--primary); color: var(--white); padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.5rem; color: var(--white); }
        .user-info { font-weight: 600; }
        .dashboard-container { max-width: 1200px; margin: 3rem auto; padding: 0 2rem; }
        .card { background: var(--white); padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        h2 { color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--secondary); padding-bottom: 0.5rem; display: inline-block; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ PowerTrack Dashboard</h1>
        <div class="user-info">
            <!-- Dynamically display the logged-in user's name -->
            Welcome, {{ request.user.username }}!
        </div>
    </header>

    <div class="dashboard-container">
        <div class="card">
            <h2>Your Area Status</h2>
            <p>Load-shedding schedules and real-time voltage monitoring for your neighborhood will appear here.</p>
        </div>
    </div>

</body>
</html>
